name: Я проверяю окна событий и выпускаю исходники
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  GOTOOLCHAIN: go1.27.3
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: '--race'
          - os: windows-2025
            flags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - name: Я проверяю контракт, время, повторы, отказы, CLI и ZIP
        run: python scripts/ci.py ${{ matrix.flags }}
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Decl1s/go-event-windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.4'
      - name: Я публикую source ZIP и SHA256 после обеих ОС
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
